# Test instance: a plain Kanboard with its SQLite database, the image's default
# administrator (admin / admin).
#
#   node test/instance.ts up     # starts this working copy's instance and bootstraps it
#   npm run test:integration
#   node test/instance.ts down   # remove everything (down -v)
#
# test/instance.ts sets the project name (-p) and KB_PORT per working copy; started by hand
# the defaults are project kbmcp-test and port 8580.
# Another release: KB_IMAGE=kanboard/kanboard:v1.2.50 node test/instance.ts up

name: kbmcp-test

services:
  kanboard:
    image: ${KB_IMAGE:-kanboard/kanboard:v1.2.57}
    ports:
      - "127.0.0.1:${KB_PORT:-8580}:80"
    volumes:
      - kbdata:/var/www/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/login"]
      interval: 2s
      retries: 30

volumes:
  kbdata:
